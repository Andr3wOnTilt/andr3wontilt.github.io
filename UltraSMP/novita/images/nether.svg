<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="netTitle netDesc">
  <title id="netTitle">Il Nether rinasce</title>
  <desc id="netDesc">Un mare di lava, torri di basalto e un portale del Nether luminoso.</desc>
  <defs>
    <linearGradient id="netSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160a0a"/>
      <stop offset=".5" stop-color="#2b0d09"/>
      <stop offset="1" stop-color="#180705"/>
    </linearGradient>
    <radialGradient id="netLava" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset=".3" stop-color="#fb923c"/>
      <stop offset=".7" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="netPortal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset=".3" stop-color="#c084fc"/>
      <stop offset=".7" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#2e1065"/>
    </radialGradient>
    <linearGradient id="netRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2b2b"/>
      <stop offset="1" stop-color="#120b0b"/>
    </linearGradient>
    <linearGradient id="netObs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0764"/>
      <stop offset="1" stop-color="#0b0410"/>
    </linearGradient>
    <radialGradient id="netGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f97316" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="netGrid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0v70" fill="none" stroke="#fca5a5" stroke-opacity=".04"/>
    </pattern>
    <filter id="netBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="netGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
