<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="comTitle comDesc">
  <title id="comTitle">Una community, tanti modi di giocare</title>
  <desc id="comDesc">Un falò acceso al centro di un accampamento con giocatori a blocchi riuniti intorno.</desc>
  <defs>
    <linearGradient id="comSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d14"/>
      <stop offset=".55" stop-color="#0d1a1b"/>
      <stop offset="1" stop-color="#162017"/>
