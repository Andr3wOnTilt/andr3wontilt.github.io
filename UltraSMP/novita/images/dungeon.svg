<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="dunTitle dunDesc">
  <title id="dunTitle">Dungeon dinamici</title>
  <desc id="dunDesc">Un cancello di pietra in un dungeon sotterraneo, illuminato da torce e rune verdi.</desc>
