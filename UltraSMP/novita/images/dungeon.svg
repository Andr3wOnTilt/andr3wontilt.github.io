      <stop offset=".55" stop-color="#0a1714"/>
      <stop offset="1" stop-color="#040908"/>
    </radialGradient>
    <radialGradient id="dunGate" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset=".25" stop-color="#34d399"/>
      <stop offset=".65" stop-color="#065f46"/>
      <stop offset="1" stop-color="#021e18"/>
    </radialGradient>
    <linearGradient id="dunStone" x1="0" y1="0" x2="0" y2="1">
