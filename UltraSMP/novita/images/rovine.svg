<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="rovTitle rovDesc">
  <title id="rovTitle">Le Rovine di Aetheria</title>
  <desc id="rovDesc">Rovine di un tempio antico con colonne spezzate e cristalli di smeraldo sotto la luna.</desc>
  <defs>
    <linearGradient id="rovSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset=".55" stop-color="#0a1a1d"/>
      <stop offset="1" stop-color="#0b211c"/>
    </linearGradient>
    <radialGradient id="rovMoon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset=".6" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rovStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a44"/>
      <stop offset="1" stop-color="#0e1b18"/>
    </linearGradient>
    <linearGradient id="rovCrystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rovFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".16"/>
      <stop offset="1" stop-color="#020807" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="rovGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#a5f3fc" stroke-opacity=".035"/>
    </pattern>
    <filter id="rovBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="rovGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
