<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="spawnTitle spawnDesc">
  <title id="spawnTitle">Benvenuti a UltraSMP</title>
  <desc id="spawnDesc">Il grande spawn di UltraSMP con torri, stendardi e sentieri illuminati al tramonto.</desc>
  <defs>
    <linearGradient id="spawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071513"/>
      <stop offset=".55" stop-color="#172b23"/>
      <stop offset="1" stop-color="#4a3a22"/>
    </linearGradient>
    <linearGradient id="spawnStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5f56"/>
      <stop offset="1" stop-color="#1b2924"/>
    </linearGradient>
    <linearGradient id="spawnRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a16207"/>
      <stop offset="1" stop-color="#4a2a0d"/>
    </linearGradient>
    <linearGradient id="spawnPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3a28"/>
      <stop offset="1" stop-color="#1b1510"/>
    </linearGradient>
    <radialGradient id="spawnGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spawnGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#fef3c7" stroke-opacity=".035"/>
    </pattern>
    <filter id="spawnBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="spawnGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#spawnSky)"/>
  <rect width="1600" height="900" fill="url(#spawnGrid)"/>
  <circle cx="800" cy="330" r="320" fill="#f59e0b" opacity=".12" filter="url(#spawnBlur)"/>
