<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="mercatoTitle mercatoDesc">
  <title id="mercatoTitle">Il primo mercato</title>
  <desc id="mercatoDesc">Un mercato notturno a blocchi con bancarelle, lanterne, bauli e monete d'oro.</desc>
  <defs>
