      <stop offset=".6" stop-color="#0d1820"/>
      <stop offset="1" stop-color="#1d1a12"/>
    </linearGradient>
    <linearGradient id="fuStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3b36"/>
      <stop offset="1" stop-color="#0b100e"/>
