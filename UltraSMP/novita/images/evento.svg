<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="eventoTitle eventoDesc">
  <title id="eventoTitle">La Notte delle Rovine</title>
  <desc id="eventoDesc">Una luna eclissata brilla sopra un tempio in rovina con rune viola e verdi.</desc>
  <defs>
    <linearGradient id="evSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a16"/>
      <stop offset=".55" stop-color="#111024"/>
      <stop offset="1" stop-color="#071310"/>
    </linearGradient>
    <radialGradient id="evMoon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fdf4ff"/>
      <stop offset=".55" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="evHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e879f9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="evStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a52"/>
      <stop offset="1" stop-color="#12121d"/>
    </linearGradient>
    <linearGradient id="evRune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <pattern id="evGrid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M76 0H0v76" fill="none" stroke="#e879f9" stroke-opacity=".04"/>
    </pattern>
    <filter id="evBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="evGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#evSky)"/>
  <rect width="1600" height="900" fill="url(#evGrid)"/>
  <circle cx="800" cy="300" r="280" fill="url(#evHalo)" filter="url(#evBlur)"/>
  <circle cx="800" cy="300" r="130" fill="url(#evMoon)"/>
