  <g fill="#a7f3d0" opacity=".35">
    <circle cx="180" cy="760" r="2"/><circle cx="1420" cy="700" r="2"/><circle cx="1360" cy="320" r="1.5"/>
    <circle cx="290" cy="250" r="1.5"/><circle cx="1250" cy="800" r="1.5"/>
