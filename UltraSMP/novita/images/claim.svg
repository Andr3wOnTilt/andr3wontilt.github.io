<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="claimTitle claimDesc">
  <title id="claimTitle">Protezioni più chiare</title>
  <desc id="claimDesc">Una mappa di appezzamenti di terreno protetti, con confini luminosi e un faro centrale.</desc>
  <defs>
    <linearGradient id="claimBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071310"/>
      <stop offset="1" stop-color="#030807"/>
    </linearGradient>
    <linearGradient id="claimLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12332a"/>
      <stop offset="1" stop-color="#071712"/>
    </linearGradient>
    <linearGradient id="claimBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#a3e635" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="claimLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="claimGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="claimGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#a7f3d0" stroke-opacity=".05"/>
    </pattern>
    <filter id="claimBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="claimGlow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#claimBg)"/>
  <rect width="1600" height="900" fill="url(#claimGrid)"/>
  <circle cx="800" cy="470" r="360" fill="url(#claimGlow)" filter="url(#claimBlur)" opacity=".8"/>
  <g transform="translate(800 470)">
    <g transform="rotate(45) translate(-390 -390)">
      <rect x="0" y="0" width="780" height="780" rx="20" fill="url(#claimLand)" stroke="#1d4a3c" stroke-width="6"/>
      <g stroke="#34d399" stroke-opacity=".16" stroke-width="3">
        <path d="M260 0v780M520 0v780M0 260h780M0 520h780"/>
      </g>
      <g fill="#0a1f19" stroke="#2f6b57" stroke-width="4">
        <rect x="40" y="42" width="180" height="180" rx="10"/>
        <rect x="300" y="42" width="180" height="180" rx="10"/>
        <rect x="560" y="42" width="180" height="180" rx="10"/>
        <rect x="40" y="300" width="180" height="180" rx="10"/>
        <rect x="560" y="300" width="180" height="180" rx="10"/>
        <rect x="40" y="560" width="180" height="180" rx="10"/>
        <rect x="300" y="560" width="180" height="180" rx="10"/>
        <rect x="560" y="560" width="180" height="180" rx="10"/>
      </g>
      <rect x="300" y="300" width="180" height="180" rx="10" fill="#0d2b22" stroke="url(#claimLine)" stroke-width="7"/>
      <rect x="318" y="318" width="144" height="144" rx="6" fill="#12382d"/>
      <rect x="362" y="362" width="56" height="56" rx="6" fill="#a3e635" opacity=".8"/>
      <path d="M390 348v84M348 390h84" stroke="#052e22" stroke-width="8"/>
      <g fill="#1f4a3c">
        <rect x="60" y="62" width="46" height="46"/>
        <rect x="122" y="92" width="52" height="34"/>
        <rect x="326" y="70" width="58" height="42"/>
        <rect x="636" y="78" width="40" height="40"/>
        <rect x="70" y="350" width="42" height="62"/>
        <rect x="620" y="350" width="58" height="50"/>
        <rect x="332" y="620" width="46" height="54"/>
        <rect x="612" y="622" width="44" height="48"/>
      </g>
      <g fill="#34d399" opacity=".55">
        <rect x="140" y="168" width="10" height="10"/>
        <rect x="420" y="116" width="8" height="8"/>
        <rect x="680" y="190" width="10" height="10"/>
        <rect x="96" y="440" width="8" height="8"/>
        <rect x="650" y="470" width="10" height="10"/>
        <rect x="430" y="700" width="8" height="8"/>
      </g>
      <g fill="#fbbf24">
