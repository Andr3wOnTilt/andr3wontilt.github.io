        <circle cx="410" cy="110" r="9"/>
        <circle cx="675" cy="125" r="9"/>
        <circle cx="150" cy="680" r="9"/>
        <circle cx="390" cy="700" r="9"/>
      </g>
      <g fill="#f87171">
        <circle cx="652" cy="650" r="9"/>
        <circle cx="96" cy="474" r="7"/>
      </g>
    </g>
  </g>
  <g filter="url(#claimGlow2)">
    <path d="M782 470h36v-280h-36z" fill="url(#claimBeam)" opacity=".7"/>
    <path d="M790 480h20v-320h-20z" fill="#a3e635" opacity=".55"/>
    <circle cx="800" cy="470" r="18" fill="#a3e635"/>
    <circle cx="800" cy="470" r="36" fill="none" stroke="#a3e635" stroke-width="3" opacity=".55"/>
  </g>
  <g font-family="'Trebuchet MS', 'Segoe UI', sans-serif">
    <rect x="104" y="112" width="342" height="96" rx="16" fill="#07130f" stroke="#34d399" stroke-opacity=".22"/>
    <text x="132" y="150" fill="#a7f3d0" font-size="18" font-weight="700" letter-spacing="4">CLAIM ATTIVO</text>
    <text x="132" y="182" fill="#dfe9e4" font-size="24" font-weight="600">Base protetta · 32 chunk</text>
    <g transform="translate(1180 110)">
      <rect x="0" y="0" width="300" height="150" rx="16" fill="#07130f" stroke="#34d399" stroke-opacity=".22"/>
      <text x="28" y="42" fill="#a7f3d0" font-size="18" font-weight="700" letter-spacing="4">PERMESSI</text>
      <g font-size="20" fill="#dfe9e4">
        <circle cx="42" cy="78" r="6" fill="#a3e635"/><text x="64" y="85">Costruire</text>
        <circle cx="42" cy="116" r="6" fill="#a3e635"/><text x="64" y="123">Usare bauli</text>
        <circle cx="210" cy="78" r="6" fill="#fbbf24"/><text x="232" y="85">Porte</text>
        <circle cx="210" cy="116" r="6" fill="#f87171"/><text x="232" y="123">PvP</text>
